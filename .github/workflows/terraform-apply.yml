name: Terraform Apply

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: terraform-apply
  cancel-in-progress: false
  queue: max

jobs:
  promote:
    name: Deploy Sandbox
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: v1.17.1

      - name: Deploy and validate sandbox
        run: make tf-prod ACTION=apply
        env:
          ISLE_PASSWORD: ${{ secrets.ISLE_PASSWORD }}
          PACKER_SSH_KEY: ${{ secrets.PACKER_SSH_KEY }}

      - name: Dump logs on failure
        if: failure()
        env:
          PACKER_SSH_KEY: ${{ secrets.PACKER_SSH_KEY }}
        run: make dump-logs-prod
