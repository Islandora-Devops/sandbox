name: Terraform Apply

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sandbox-terraform
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Sandbox
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.14.6

      - name: Install lint tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint Terraform and shell scripts
        run: make lint

      - name: Deploy and validate sandbox
        run: make deploy-prod
        env:
          ISLE_PASSWORD: ${{ secrets.ISLE_PASSWORD }}

      - name: Dump logs on failure
        if: failure()
        env:
          PACKER_SSH_KEY: ${{ secrets.PACKER_SSH_KEY }}
        run: make dump-logs-prod
