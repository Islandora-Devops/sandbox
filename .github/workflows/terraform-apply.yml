name: Terraform Apply

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        default: prod
        options:
          - prod
          - promote

jobs:
  promote:
    name: Deploy Sandbox
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.14.6

      - name: Deploy and validate test
        if: github.event_name == 'push' || inputs.target == 'promote'
        run: make tf-test ACTION=apply
        env:
          ISLE_PASSWORD: ${{ secrets.ISLE_PASSWORD }}

      - name: Upload test deployment artifacts
        if: github.event_name == 'push' || inputs.target == 'promote'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-deployment-artifacts
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Deploy and validate sandbox
        run: make tf-prod ACTION=apply
        env:
          ISLE_PASSWORD: ${{ secrets.ISLE_PASSWORD }}

      - name: Clean up test compute after sandbox promotion
        if: github.event_name == 'push' || inputs.target == 'promote'
        run: make tf-test ACTION=cleanup
        env:
          ISLE_PASSWORD: ${{ secrets.ISLE_PASSWORD }}

      - name: Dump logs on failure
        if: failure()
        env:
          PACKER_SSH_KEY: ${{ secrets.PACKER_SSH_KEY }}
        run: make dump-logs-prod
