name: Terraform PR Test

on:
  pull_request:
    branches:
      - main

concurrency:
  group: sandbox-terraform
  cancel-in-progress: false

jobs:
  terraform:
    name: Deploy Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_API_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.14.6

      - name: Install lint tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Lint Terraform and shell scripts
        run: make lint

      - name: Terraform Plan test
        id: plan_test
        run: make tf-test ACTION=plan TF_OUTPUT_NAME=test_plan
        env:
          ISLE_PASSWORD: ${{ secrets.ISLE_PASSWORD }}

      - name: Terraform Plan sandbox
        id: plan_sandbox
        run: make tf-prod ACTION=plan TF_OUTPUT_NAME=sandbox_plan
        env:
          ISLE_PASSWORD: ${{ secrets.ISLE_PASSWORD }}

      - name: Post Terraform plan comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          TEST_PLAN: ${{ steps.plan_test.outputs.test_plan }}
          SANDBOX_PLAN: ${{ steps.plan_sandbox.outputs.sandbox_plan }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const commentIdentifier = '<!-- terraform-plan-comment -->';
            const newCommentBody = `#### Terraform Plan
            ${commentIdentifier}
            <details open><summary>test workspace</summary>

            \`\`\`terraform
            ${process.env.TEST_PLAN || ''}
            \`\`\`

            </details>

            <details><summary>sandbox workspace</summary>

            \`\`\`terraform
            ${process.env.SANDBOX_PLAN || ''}
            \`\`\`

            </details>`;

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existingComment = comments.find(c => c.body.includes(commentIdentifier));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body: newCommentBody,
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: newCommentBody });
            }

      - name: Deploy and validate test
        run: make deploy-test
        env:
          ISLE_PASSWORD: ${{ secrets.ISLE_PASSWORD }}

      - name: Dump test logs on failure
        if: failure()
        env:
          PACKER_SSH_KEY: ${{ secrets.PACKER_SSH_KEY }}
        run: make dump-logs-test

      - name: Upload test deployment artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-deployment-artifacts
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Clean up test compute
        if: always()
        run: make cleanup-test
        env:
          ISLE_PASSWORD: ${{ secrets.ISLE_PASSWORD }}
