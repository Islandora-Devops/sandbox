services:
  traefik:
    # Compose replaces command entirely; retain the template's base options.
    command: >-
      --ping=true
      --log.level=INFO
      --entryPoints.http.address=:80
      --entryPoints.http.forwardedHeaders.trustedIPs=${FRONTEND_IP_1},${FRONTEND_IP_2},${FRONTEND_IP_3}
      --entryPoints.http.http.encodedCharacters.allowEncodedSlash=true
      --entryPoints.http.http.encodedCharacters.allowEncodedPercent=true
      --entryPoints.http.http.encodedCharacters.allowEncodedQuestionMark=true
      --entryPoints.http.http.encodedCharacters.allowEncodedHash=true
      --entryPoints.http.transport.respondingTimeouts.readTimeout=60
      --entryPoints.https.address=:443
      --entryPoints.https.forwardedHeaders.trustedIPs=${FRONTEND_IP_1},${FRONTEND_IP_2},${FRONTEND_IP_3}
      --entryPoints.https.http.encodedCharacters.allowEncodedSlash=true
      --entryPoints.https.http.encodedCharacters.allowEncodedPercent=true
      --entryPoints.https.http.encodedCharacters.allowEncodedQuestionMark=true
      --entryPoints.https.http.encodedCharacters.allowEncodedHash=true
      --entryPoints.https.transport.respondingTimeouts.readTimeout=60
      --providers.file.directory=/etc/traefik/dynamic
      --providers.docker=true
      --providers.docker.network=default
      --providers.docker.exposedByDefault=false
      --api.insecure=${DEVELOPMENT_ENVIRONMENT:-false}
      --api.dashboard=${DEVELOPMENT_ENVIRONMENT:-false}
      --api.debug=${DEVELOPMENT_ENVIRONMENT:-false}
      --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=http
      --certificatesresolvers.letsencrypt.acme.storage=/acme/acme.json
      --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      --certificatesresolvers.letsencrypt.acme.caserver=${ACME_URL}
      --experimental.localPlugins.captcha-protect.moduleName=github.com/libops/captcha-protect
      --entryPoints.https.http.middlewares=captcha-protect@docker
    labels:
      traefik.enable: "true"
      traefik.http.middlewares.captcha-protect.plugin.captcha-protect.captchaProvider: poj
      traefik.http.middlewares.captcha-protect.plugin.captcha-protect.siteKey: sandbox
      traefik.http.middlewares.captcha-protect.plugin.captcha-protect.secretKey: ${CAPTCHA_SECRET:?CAPTCHA_SECRET must be set}
      traefik.http.middlewares.captcha-protect.plugin.captcha-protect.protectRoutes: /
      traefik.http.middlewares.captcha-protect.plugin.captcha-protect.enableCommonCrawlIPCheck: "false"
    volumes:
      # Preserve certificates when the nightly reset removes Docker volumes.
      - /opt/sandbox/acme:/acme:rw
      - ./captcha-protect:/plugins-local/src/github.com/libops/captcha-protect:ro,z
